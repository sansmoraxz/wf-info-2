[package]
name = "wf-ocr"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
log.workspace = true
thiserror.workspace = true
serde.workspace = true
rust-embed.workspace = true
ocr-rs = "2.4.0"
image = "0.25"
imageproc = "0.27"
itertools.workspace = true

[features]
default = []
vulkan = ["ocr-rs/vulkan"] # Vulkan API - cross platform (recomended)
cuda = ["ocr-rs/cuda"] # NVIDIA GPU only
opencl = ["ocr-rs/opencl"] # Cross platform - recomended for very old gpu without vulkan
opengl = ["ocr-rs/opengl"] # Linux only
