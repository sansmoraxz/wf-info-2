[workspace]
members = [
    "apps/wf-info-cli",
    "apps/wf-info-daemon",
    "crates/wf-control",
    "crates/wf-core",
    "crates/wf-inventory",
    "crates/wf-itemdata",
    "crates/wf-ocr",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1.0.100"
base64 = "0.22"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
env_logger = "0.11.8"
futures-util = "0.3"
image = "0.25"
log = "0.4.29"
memchr = "2"
notify = "8.2"
notify-debouncer-mini = "0.7"
rand = "0.9"
reqwest = { version = "0.13", features = ["json", "query"] }
scopeguard = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.20"
serde_with = { version = "3.16.1", features = ["chrono"] }
sha2 = "0.10"
sysinfo = "0.38"
tantivy = { version = "0.25", default-features = false, features = ["mmap"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
itertools = "0.14.0"
rust-embed = "8.11.0"
x11rb = "0.13.2"

[workspace.dependencies.ashpd]
version = "0.12"
default-features = false
features = ["tokio"]

[workspace.dependencies.win-screenshot]
version = "4.0"

[workspace.dependencies.winapi]
version = "0.3"
features = ["processthreadsapi", "memoryapi", "handleapi", "winnt"]
