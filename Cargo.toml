[package]
name = "wf-info-2"
version = "0.1.0"
edition = "2024"

[dependencies]
memchr = "2"
notify = "8.2"
notify-debouncer-mini = "0.7"
chrono = {version = "0.4", features = ["serde"] }
anyhow = "1.0.100"
log = "0.4.29"
env_logger = "0.11.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
rand = "0.9"
dirs = "6.0"
sysinfo = "0.38"
hex = "0.4"
sha2 = "0.10"
rustc-hash = "2.1.1"
serde_repr = "0.1.20"
serde_with = { version = "3.16.1", features = ["chrono"] }
tantivy = { version = "0.25", default-features = false, features = ["mmap"] }
scopeguard = "1.2"
image = "0.25"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
win-screenshot = "4.0"
winapi = { version = "0.3", features = ["processthreadsapi", "memoryapi", "handleapi", "winnt"], optional = true }

[features]
default = []
memory = ["winapi"]  # Enable memory reading features. Note: May put you at risk of being flagged. Use proper judgment and ensure you understand the implications of enabling this feature.
